databases:
  - name: bodas-porcelana-db
    databaseName: bodas
    user: bodas_user
services:
  - type: web
    name: bodas-porcelana
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bodas-porcelana-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: '1'
